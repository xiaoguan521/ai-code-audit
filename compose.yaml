x-scanner-image: &scanner-image ${AUDIT_SCANNER_IMAGE:-ghcr.io/xiaoguan521/ai-code-audit:main}

services:
  # 仅用于显式拉取镜像。实际审查由 audit 为每个仓库启动此镜像的独立容器。
  scanner-image:
    image: *scanner-image
    profiles:
      - images

  audit:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    image: ${AUDIT_RUNNER_IMAGE:-ghcr.io/xiaoguan521/ai-code-audit-runner:main}
    init: true
    environment:
      AUDIT_DATA_DIR: ${AUDIT_DATA_DIR:?请先从 .env.example 创建 .env 并设置绝对路径}
      AUDIT_MODEL_NETWORK: ${AUDIT_MODEL_NETWORK:-ai-audit-model-net}
      AUDIT_AGENT_TYPE: ${AUDIT_AGENT_TYPE:-pi-docker}
      AUDIT_SCANNER_IMAGE: *scanner-image
      AUDIT_MODEL_ENV_PATH: /run/secrets/model.env
      AUDIT_HARNESS_LAUNCHER: ${AUDIT_HARNESS_LAUNCHER:-docker}
      AUDIT_HARNESS_BIN: ${AUDIT_HARNESS_BIN:-dsh}
      AUDIT_HARNESS_ARGS: '${AUDIT_HARNESS_ARGS:-["headless","--json","--permission-mode","read-only","--approval-policy","never"]}'
      AUDIT_SUMMARY_ENABLED: ${AUDIT_SUMMARY_ENABLED:-false}
      AUDIT_SUMMARY_IMAGE: ${AUDIT_SUMMARY_IMAGE:-}
      AUDIT_SUMMARY_NETWORK: ${AUDIT_SUMMARY_NETWORK:-}
      AUDIT_SUMMARY_MODEL_ENV_PATH: ${AUDIT_SUMMARY_MODEL_ENV_PATH:-}
      TZ: Asia/Shanghai
    volumes:
      # Docker CLI 通过宿主机的 daemon 启动只读的扫描容器。
      - type: bind
        source: ${AUDIT_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
      # 调度容器和宿主机必须看到同一个绝对路径，daemon 才能挂载项目副本。
      - type: bind
        source: ${AUDIT_DATA_DIR:?请先从 .env.example 创建 .env 并设置绝对路径}
        target: ${AUDIT_DATA_DIR:?请先从 .env.example 创建 .env 并设置绝对路径}
      - type: bind
        source: ./config/projects.local.csv
        target: /opt/ai-code-audit/config/projects.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./model.env
        target: /run/secrets/model.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/git-credentials
        target: /run/secrets/git-credentials
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ssh
        target: /root/.ssh
        read_only: true
    networks:
      - model

networks:
  model:
    name: ${AUDIT_MODEL_NETWORK:-ai-audit-model-net}
