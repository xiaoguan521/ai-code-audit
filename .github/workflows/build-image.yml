name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "skill/**"
      - "config/**"
      - "runner/**"
      - "tests/**"
      - "tools/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "docker/**"
      - "skill/**"
      - "config/**"
      - "runner/**"
      - "tests/**"
      - "tools/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "覆盖 DeepSeek Harness 版本（留空用 docker/DSH_VERSION）"
        required: false

permissions:
  contents: read

env:
  # 同时支持 x86_64 和 ARM64（鲲鹏、飞腾等 ARM 服务器）；推到 GHCR 的是多架构镜像，docker pull 自动选架构
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python tests/check_consistency.py
      - run: python tools/gen_checklist.py && git diff --exit-code -- config/checklist.json
      - run: python tests/make_samples.py /tmp/out
      - run: for f in docker/*.sh; do sh -n "$f"; done

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 打 tag 时把离线镜像包挂到 Release
      packages: write      # 推送到 GHCR
    steps:
      - uses: actions/checkout@v4

      - name: 准备变量
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.dsh_version }}
        run: |
          v="$INPUT_VERSION"
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::DeepSeek Harness 版本号格式不对：$v"; exit 1
          fi
          [ -z "$v" ] && v="$(tr -d '[:space:]' < docker/DSH_VERSION)"
          echo "dsh_version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "runner_image=ghcr.io/${GITHUB_REPOSITORY,,}-runner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          cache-image: ${{ github.event_name != 'pull_request' }}
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ai-code-audit
            org.opencontainers.image.description=八性 AI 代码检查（DeepSeek Harness + Skill）
            io.deepseek.harness.version=${{ steps.vars.outputs.dsh_version }}

      - name: 生成调度镜像标签
        id: runner_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.runner_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ai-code-audit-runner
            org.opencontainers.image.description=八性 AI 代码检查批量调度器
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # 每个架构各构建一份并本地加载，分别验证 dsh、headless Profile 和八性 Skill；
      # arm64 在 x86 runner 上经 QEMU 模拟运行（较慢，靠缓存加速）。
      - name: 构建 amd64（本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ai-code-audit:ci-amd64
          build-args: DSH_VERSION=${{ steps.vars.outputs.dsh_version }}
          cache-from: type=gha,scope=amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=amd64,mode=max,ignore-error=true' || '' }}

      - name: 冒烟测试 amd64（不连模型）
        run: sh docker/smoke_scanner_image.sh amd64

      - name: 构建 arm64（本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          load: true
          tags: ai-code-audit:ci-arm64
          build-args: DSH_VERSION=${{ steps.vars.outputs.dsh_version }}
          cache-from: type=gha,scope=arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=arm64,mode=max,ignore-error=true' || '' }}

      - name: 冒烟测试 arm64（不连模型）
        run: sh docker/smoke_scanner_image.sh arm64

      - name: 构建调度器 amd64（本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runner
          platforms: linux/amd64
          load: true
          tags: ai-code-audit-runner:ci-amd64
          cache-from: type=gha,scope=runner-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=runner-amd64,mode=max,ignore-error=true' || '' }}

      - name: 构建调度器 arm64（本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runner
          platforms: linux/arm64
          load: true
          tags: ai-code-audit-runner:ci-arm64
          cache-from: type=gha,scope=runner-arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=runner-arm64,mode=max,ignore-error=true' || '' }}

      - name: 调度器冒烟测试（两个架构，不连接 Git 或模型）
        run: |
          for arch in amd64 arm64; do
            img="ai-code-audit-runner:ci-$arch"
            [ "$(docker image inspect -f '{{.Architecture}}' "$img")" = "$arch" ] || { echo "::error::$img 架构不是 $arch"; exit 1; }
            docker run --rm --network none --platform "linux/$arch" --entrypoint sh "$img" -c '
              python3 --version && git --version && docker --version && ssh -V 2>&1 &&
              cloc --version >/dev/null && gitleaks version >/dev/null &&
              semgrep --version >/dev/null && lizard --version >/dev/null &&
              test -x /opt/ai-code-audit/docker/git-credential-readonly.sh &&
              test "$(git config --system --get credential.useHttpPath)" = true &&
              test "$(git config --system --get credential.helper)" = /opt/ai-code-audit/docker/git-credential-readonly.sh &&
              test -f /opt/ai-code-audit/runner/run_daily.py &&
              test -f /opt/ai-code-audit/config/checklist.json'
            docker run --rm --network none --platform "linux/$arch" \
              -e AUDIT_DATA_DIR=/tmp/audit -e AUDIT_MODEL_NETWORK=ci-model \
              "$img" --help | grep -q -- '--dry-run'
            docker run --rm --network none --platform "linux/$arch" \
              -e PYTHONPATH=/opt/ai-code-audit \
              -v "$PWD/tests/runner_prescan_smoke.py:/test/prescan.py:ro" \
              --entrypoint python3 "$img" /test/prescan.py
          done

      - name: 验证两个镜像与 OpenAI 兼容模型的 Harness 工具调用
        run: |
          for arch in amd64 arm64; do
            python3 tests/harness_openai_smoke.py "ai-code-audit:ci-$arch" "ai-code-audit-runner:ci-$arch"
          done

      - name: 推送扫描镜像
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DSH_VERSION=${{ steps.vars.outputs.dsh_version }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - name: 推送调度镜像
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runner
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.runner_meta.outputs.tags }}
          labels: ${{ steps.runner_meta.outputs.labels }}
          cache-from: |
            type=gha,scope=runner-amd64
            type=gha,scope=runner-arm64

      - name: 导出离线镜像包（仅版本 tag，每种镜像和架构各一个）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SCANNER_IMAGE: ${{ steps.vars.outputs.image }}
          RUNNER_IMAGE: ${{ steps.vars.outputs.runner_image }}
        shell: bash
        run: bash docker/export_release_images.sh

      - name: 上传为 Release 附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: offline/*
          generate_release_notes: true
