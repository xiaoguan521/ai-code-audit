name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "frontend/**"
      - "skill/**"
      - "config/**"
      - "runner/**"
      - "tests/**"
      - "tools/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "docker/**"
      - "frontend/**"
      - "skill/**"
      - "config/**"
      - "runner/**"
      - "tests/**"
      - "tools/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "覆盖 DeepSeek Harness 版本（留空用 docker/DSH_VERSION）"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python tests/check_consistency.py
      - run: python tools/gen_checklist.py && git diff --exit-code -- config/checklist.json
      - run: python tests/make_samples.py /tmp/out
      - run: for f in docker/*.sh; do sh -n "$f"; done

  # 每个架构在原生 runner 上构建一次：amd64 跑 ubuntu-24.04，arm64 跑
  # ubuntu-24.04-arm，不再用 QEMU 模拟。两个镜像（扫描 + 调度）在同一个
  # job 里构建，因为 harness_openai_smoke.py 需要同架构的两个镜像配合验证。
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write      # 推送架构镜像到 GHCR
    steps:
      - uses: actions/checkout@v4

      - name: 准备变量
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.dsh_version }}
        run: |
          v="$INPUT_VERSION"
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::DeepSeek Harness 版本号格式不对：$v"; exit 1
          fi
          [ -z "$v" ] && v="$(tr -d '[:space:]' < docker/DSH_VERSION)"
          echo "dsh_version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "runner_image=ghcr.io/${GITHUB_REPOSITORY,,}-runner" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 每个镜像只构建一次并本地加载冒烟；同时打上 ci 标签（本地冒烟用）和
      # sha-<短提交号>-<架构> 标签（后续合并多架构 manifest 用，冒烟通过后推送）。
      - name: 构建扫描镜像（本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: |
            ai-code-audit:ci-${{ matrix.arch }}
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=ai-code-audit
            org.opencontainers.image.description=八性 AI 代码检查（DeepSeek Harness + Skill）
            io.deepseek.harness.version=${{ steps.vars.outputs.dsh_version }}
          build-args: DSH_VERSION=${{ steps.vars.outputs.dsh_version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max,ignore-error=true', matrix.arch) || '' }}

      - name: 冒烟测试扫描镜像（不连模型）
        run: sh docker/smoke_scanner_image.sh ${{ matrix.arch }}

      - name: 构建调度镜像（本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runner
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: |
            ai-code-audit-runner:ci-${{ matrix.arch }}
            ${{ steps.vars.outputs.runner_image }}:sha-${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=ai-code-audit-runner
            org.opencontainers.image.description=八性 AI 代码检查批量调度器
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=runner-{0},mode=max,ignore-error=true', matrix.arch) || '' }}

      - name: 调度器冒烟测试（本架构，不连接 Git 或模型）
        run: |
          arch="${{ matrix.arch }}"
          img="ai-code-audit-runner:ci-$arch"
          [ "$(docker image inspect -f '{{.Architecture}}' "$img")" = "$arch" ] || { echo "::error::$img 架构不是 $arch"; exit 1; }
          docker run --rm --network none --platform "linux/$arch" --entrypoint sh "$img" -c '
            python3 --version && git --version && docker --version && ssh -V 2>&1 &&
            cloc --version >/dev/null && gitleaks version >/dev/null &&
            semgrep --version >/dev/null && lizard --version >/dev/null &&
            test -x /opt/ai-code-audit/docker/git-credential-readonly.sh &&
            test "$(git config --system --get credential.useHttpPath)" = true &&
            test "$(git config --system --get credential.helper)" = /opt/ai-code-audit/docker/git-credential-readonly.sh &&
            test -f /opt/ai-code-audit/runner/run_daily.py &&
            test -f /opt/ai-code-audit/config/checklist.json'
          docker run --rm --network none --platform "linux/$arch" \
            -e AUDIT_DATA_DIR=/tmp/audit -e AUDIT_MODEL_NETWORK=ci-model \
            "$img" --help | grep -q -- '--dry-run'
          docker run --rm --network none --platform "linux/$arch" \
            -e PYTHONPATH=/opt/ai-code-audit \
            -v "$PWD/tests/runner_prescan_smoke.py:/test/prescan.py:ro" \
            --entrypoint python3 "$img" /test/prescan.py

      - name: 验证本架构两个镜像与 OpenAI 兼容模型的 Harness 工具调用
        run: python3 tests/harness_openai_smoke.py "ai-code-audit:ci-${{ matrix.arch }}" "ai-code-audit-runner:ci-${{ matrix.arch }}"

      # 冒烟通过后再推送架构标签；manifest 步骤用这两个标签合并多架构镜像。
      # 只推送 sha 架构标签，不推送 ci 标签（ci 标签只供本机冒烟）。
      - name: 推送架构镜像
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}"
          docker push "${{ steps.vars.outputs.runner_image }}:sha-${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}"

  # 把两个架构的镜像合并成多架构 manifest，再打上 main / sha / latest 等标签。
  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # 打 tag 时把离线镜像包挂到 Release
      packages: write      # 合并并推送多架构 manifest 到 GHCR
    steps:
      - uses: actions/checkout@v4

      - name: 准备变量
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.dsh_version }}
        run: |
          v="$INPUT_VERSION"
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::DeepSeek Harness 版本号格式不对：$v"; exit 1
          fi
          [ -z "$v" ] && v="$(tr -d '[:space:]' < docker/DSH_VERSION)"
          echo "dsh_version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "runner_image=ghcr.io/${GITHUB_REPOSITORY,,}-runner" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ai-code-audit
            org.opencontainers.image.description=八性 AI 代码检查（DeepSeek Harness + Skill）
            io.deepseek.harness.version=${{ steps.vars.outputs.dsh_version }}

      - name: 生成调度镜像标签
        id: runner_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.runner_image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ai-code-audit-runner
            org.opencontainers.image.description=八性 AI 代码检查批量调度器
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 合并多架构镜像
        run: |
          set -euo pipefail
          image="${{ steps.vars.outputs.image }}"
          runner_image="${{ steps.vars.outputs.runner_image }}"
          short_sha="${{ steps.vars.outputs.short_sha }}"
          scanner_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && scanner_args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          runner_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && runner_args+=(-t "$tag")
          done <<< "${{ steps.runner_meta.outputs.tags }}"
          docker buildx imagetools create "${scanner_args[@]}" \
            "$image:sha-$short_sha-amd64" "$image:sha-$short_sha-arm64"
          docker buildx imagetools create "${runner_args[@]}" \
            "$runner_image:sha-$short_sha-amd64" "$runner_image:sha-$short_sha-arm64"

      - name: 导出离线镜像包（仅版本 tag，每种镜像和架构各一个）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SCANNER_IMAGE: ${{ steps.vars.outputs.image }}
          RUNNER_IMAGE: ${{ steps.vars.outputs.runner_image }}
        shell: bash
        run: bash docker/export_release_images.sh

      - name: 上传为 Release 附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: offline/*
          generate_release_notes: true
