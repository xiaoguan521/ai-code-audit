name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "skill/**"
      - "config/**"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "docker/**"
      - "skill/**"
      - "config/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      qwen_code_version:
        description: "覆盖 Qwen Code 版本（留空用 docker/QWEN_CODE_VERSION）"
        required: false

permissions:
  contents: read

env:
  # 内网服务器一般是 x86_64；需要 ARM 时改成 linux/amd64,linux/arm64
  PLATFORMS: linux/amd64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/check_consistency.py
      - run: python tools/gen_checklist.py && git diff --exit-code -- config/checklist.json
      - run: python tests/make_samples.py /tmp/out
      - run: for f in docker/*.sh; do sh -n "$f"; done

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 打 tag 时把离线镜像包挂到 Release
      packages: write      # 推送到 GHCR
    steps:
      - uses: actions/checkout@v4

      - name: 准备变量
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.qwen_code_version }}
        run: |
          v="$INPUT_VERSION"
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Qwen Code 版本号格式不对：$v"; exit 1
          fi
          [ -z "$v" ] && v="$(tr -d '[:space:]' < docker/QWEN_CODE_VERSION)"
          echo "qwen_code_version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ai-code-audit
            org.opencontainers.image.description=八性 AI 代码检查（Qwen Code + Skill）
            io.qwen-code.version=${{ steps.vars.outputs.qwen_code_version }}

      - name: 构建（单架构先本地加载用于冒烟测试）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ai-code-audit:ci
          build-args: QWEN_CODE_VERSION=${{ steps.vars.outputs.qwen_code_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（不连模型）
        run: |
          docker run --rm --entrypoint qwen ai-code-audit:ci --version
          docker run --rm --entrypoint sh ai-code-audit:ci -c '
            test -f /opt/audit/skills/eight-quality-code-audit/SKILL.md &&
            test -f /opt/audit/result.schema.json &&
            test -f /etc/qwen-code/settings.json &&
            grep -q "\"usageStatisticsEnabled\": false" /etc/qwen-code/settings.json &&
            [ "$(id -u)" != "0" ] && echo "镜像内容检查通过"'
          # 未配置模型地址时入口脚本应拒绝启动
          mkdir -p /tmp/ctx && echo test > /tmp/ctx/prompt.md
          if docker run --rm -v /tmp/ctx:/workspace/context:ro ai-code-audit:ci; then echo "入口脚本未校验环境变量" && exit 1; fi

      - name: 推送镜像
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: QWEN_CODE_VERSION=${{ steps.vars.outputs.qwen_code_version }}
          cache-from: type=gha

      - name: 导出离线镜像包（仅版本 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="ai-code-audit_${GITHUB_REF_NAME}_amd64.tar.gz"
          docker tag ai-code-audit:ci "ai-code-audit:${GITHUB_REF_NAME#v}"
          docker save "ai-code-audit:${GITHUB_REF_NAME#v}" | gzip > "$name"
          sha256sum "$name" > "$name.sha256"
          echo "OFFLINE=$name" >> "$GITHUB_ENV"

      - name: 上传为 Release 附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OFFLINE }}
            ${{ env.OFFLINE }}.sha256
          generate_release_notes: true
